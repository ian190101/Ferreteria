name: calmina-validacion

services:
  db-testing:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: fabrica_calmina_aroma_testing
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./docker/testing/init.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
