name: ferreteria-local

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${APP_ENV_FILE:-.env.docker.local}
  environment:
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-180}
    RESTORE_DB_DATABASE: ${DB_DATABASE:-inventario}_restore_verification
    RESTORE_DB_USERNAME: calmina_restore
    RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?Define RESTORE_DB_PASSWORD}
  restart: unless-stopped
  volumes:
    - app_storage:/var/www/html/storage
  depends_on:
    db-ferreteria:
      condition: service_healthy
  networks:
    - ferreteria_net

services:
  app-ferreteria:
    <<: *app-base
    ports:
      - "${LOCAL_HTTP_BIND:-127.0.0.1}:${LOCAL_HTTP_PORT:-80}:10000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: ${APP_HEALTH_START_PERIOD:-1800s}

  queue-ferreteria:
    <<: *app-base
    user: www-data
    stop_grace_period: 180s
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      app-ferreteria:
        condition: service_healthy
      db-ferreteria:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor default --max=200 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  scheduler-ferreteria:
    <<: *app-base
    user: www-data
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      app-ferreteria:
        condition: service_healthy
      db-ferreteria:
        condition: service_healthy

  maintenance-ferreteria:
    <<: *app-base
    user: www-data
    stop_grace_period: 1900s
    command: ["php", "artisan", "queue:work", "maintenance", "--queue=maintenance", "--sleep=2", "--tries=1", "--timeout=1800"]
    depends_on:
      app-ferreteria:
        condition: service_healthy
      db-ferreteria:
        condition: service_healthy

  db-ferreteria:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=120
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventario}
      MYSQL_USER: ${DB_USERNAME:-ferreteria}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.docker.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env.docker.local}
      RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?Define RESTORE_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-maintenance.sh:/docker-entrypoint-initdb.d/20-maintenance.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - ferreteria_net

volumes:
  mysql_data:
  app_storage:

networks:
  ferreteria_net:
    driver: bridge
